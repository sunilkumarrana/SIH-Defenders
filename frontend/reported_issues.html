<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reported Issues - RoadGuard AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09080e;
  --panel: #13111c;
  --panel-light: #1c182b;
  --line: rgba(255, 255, 255, 0.1);
  --text: #f9f8fc;
  --muted: #9e95b9;
  
  --primary: #ff5e36;
  --primary-glow: rgba(255, 94, 54, 0.35);
  --secondary: #9061f9;
  --accent: #00f5d4;
  --accent-glow: rgba(0, 245, 212, 0.35);
  
  --red: #ff4b4b;
  --green: #00f5d4;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  transition: all 0.2s ease-out;
}

body {
  background: radial-gradient(circle at 50% -10%, #251b3a 0%, #09080e 70%), #09080e;
  color: var(--text);
  font-family: "Outfit", sans-serif;
  min-height: 100vh;
}

.nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(4, 2, 9, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}

.nav-container {
  max-width: 1200px;
  margin: auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.logo span {
  color: var(--primary);
  text-shadow: 0 0 10px var(--primary-glow);
}

.container {
  max-width: 1000px;
  margin: 60px auto;
  padding: 0 24px;
}

.page-header {
  margin-bottom: 40px;
}

.page-header h1 {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 8px;
}

.page-header p {
  color: var(--muted);
  font-size: 16px;
}

.panel-container {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 30px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.history-card {
  background: var(--panel-light);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.history-card.fixed {
  border-color: rgba(0, 245, 212, 0.3);
  background: linear-gradient(90deg, var(--panel-light) 0%, rgba(0, 245, 212, 0.05) 100%);
}

.history-details {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-id {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}

.history-meta {
  font-size: 14px;
  color: var(--muted);
  display: flex;
  gap: 16px;
}

.history-meta span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-badge {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  display: inline-block;
}

.status-badge.critical { background: rgba(255, 75, 75, 0.1); color: var(--red); }
.status-badge.high { background: rgba(144, 97, 249, 0.1); color: var(--primary); }
.status-badge.medium { background: rgba(255, 222, 0, 0.1); color: #ffde00; }
.status-badge.low { background: rgba(0, 245, 212, 0.1); color: var(--green); }
.status-badge.fixed { background: rgba(0, 245, 212, 0.2); color: var(--green); box-shadow: 0 0 10px rgba(0,245,212,0.2); }

.history-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

.btn-fix {
  background: transparent;
  color: var(--green);
  border: 1px solid var(--green);
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
}

.btn-fix:hover {
  background: rgba(0, 245, 212, 0.1);
  box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
}

.fixed-label {
  color: var(--green);
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.empty-state {
  text-align: center;
  padding: 60px 0;
  color: var(--muted);
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-container">
    <div class="logo" onclick="window.location.href='index.html'">ROAD<span>GUARD</span> AI</div>
    <div class="nav-links">
      <button onclick="window.location.href='index.html'">Back to Dashboard</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Reported Issues</h1>
    <p>Track all reports submitted from this terminal and verify their repair status.</p>
  </div>
  
  <div class="panel-container">
    <div class="history-list" id="historyList">
      <!-- Generated via JS -->
    </div>
  </div>
</div>

<script>
function loadHistory() {
  const historyList = document.getElementById('historyList');
  let history = JSON.parse(localStorage.getItem('reportsHistory') || '[]');
  
  if (history.length === 0) {
    historyList.innerHTML = `
      <div class="empty-state">
        <div style="font-size:48px;margin-bottom:16px;opacity:0.5;">📋</div>
        <h3>No dispatches found</h3>
        <p>Reports submitted from the AI Scanner will appear here.</p>
      </div>
    `;
    return;
  }
  
  // Sort to show newest first
  history.reverse();
  
  historyList.innerHTML = history.map((report, index) => {
    // Determine original index for updating
    const actualIndex = history.length - 1 - index;
    const isFixed = report.status === 'fixed';
    
    return `
      <div class="history-card ${isFixed ? 'fixed' : ''}">
        <div class="history-details">
          <div class="history-id">${report.id} <span class="status-badge ${isFixed ? 'fixed' : report.severity}" style="margin-left:12px;">${isFixed ? 'FIXED' : report.severity}</span></div>
          <div class="history-meta">
            <span>📍 ${report.location}</span>
            <span>📦 ${report.volume} m³</span>
            <span>🕒 ${report.date}</span>
          </div>
        </div>
        <div class="history-actions">
          ${isFixed ? 
            `<div class="fixed-label">✓ Maintenance Completed</div>` : 
            `<button class="btn-fix" onclick="markAsFixed(${actualIndex})">Mark as Fixed</button>`
          }
        </div>
      </div>
    `;
  }).join('');
}

function markAsFixed(index) {
  let history = JSON.parse(localStorage.getItem('reportsHistory') || '[]');
  if (history[index]) {
    history[index].status = 'fixed';
    localStorage.setItem('reportsHistory', JSON.stringify(history));
    loadHistory(); // Reload UI
  }
}

// Load on start
window.addEventListener('DOMContentLoaded', loadHistory);
</script>
</body>
</html>
